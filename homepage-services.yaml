- Smart Home:
    - Solar live:
        icon: home-assistant
        href: https://ha.stoica-homepc.duckdns.org/dashboard-solar/0
        description: Putere instant
        server: my-docker
        container: homeassistant
        widget:
          type: homeassistant
          url: http://host.docker.internal:8123
          key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJiNTQ3ZGU4ZjIwOWM0NTc1OTQ5NGY3ZjcxNmY1MmE3NiIsImlhdCI6MTc3ODgyMjA1MiwiZXhwIjoyMDk0MTgyMDUyfQ.1A1gk7pLMlync03FvQ2aK5HR1wMfJ4J4tY_48GG5eLw"
          custom:
            - state: sensor.deye_pv_power
              label: ☀️ Solar
              suffix: " W"
            - state: sensor.deye_battery
              label: 🔋 Baterie
              suffix: "%"
            - state: sensor.deye_grid_power
              label: 🔌 Grid
              suffix: " W"
            - state: sensor.deye_device_state
              label: ⚙️ Stare

