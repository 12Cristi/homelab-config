services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    init: true
    ports:
      - "3000:3000"
    volumes:
      - /home/cristi/server/homepage/config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=homepc.local:3000,homepc.local:3000,192.168.68.200:3000,homepc:3000,homepc.tail1b235c.ts.net:3000,100.113.68.25:3000,localhost:3000
    restart: always 

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host
    volumes:
      - ./jellyfin:/config
      - ./movies:/media/movies
      - ./series:/media/series
    restart: always

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - ./qb-config:/config
      - ./downloads:/downloads
      - ./movies:/movies
    ports:
      - 51413:51413/tcp
      - 51413:51413/udp
      - 8080:8080
    restart: always
    dns: 
      - 8.8.8.8
      - 1.1.1.1
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    privileged: true  # Doar dacă tot mai dă erori de permisiuni
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CHOWN
    ports:
      - "192.168.68.200:53:53/tcp"
      - "100.113.68.25:53:53/tcp"
      - "192.168.68.200:53:53/udp"
      - "100.113.68.25:53:53/udp"
      - "8082:80"
    environment:
      - TZ=Europe/Bucharest
      - FTLCONF_webserver_api_password=REDACTED
      - FTLCONF_webserver_api_cli_pw=false
    volumes:
      - /home/cristi/server/pihole/etc-pihole:/etc/pihole
      - /home/cristi/server/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: always

  cups-airprint:
    image: jdrtronix/cups-hplip:latest
    container_name: cups-airprint
    restart: always
    network_mode: host
    privileged: true
    devices:
      - "/dev/bus/usb/002/004:/dev/bus/usb/002/004" # Mapare directă bazată pe lsusb
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ./cups-config/etc-cups:/etc/cups
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
    environment:
      - CUPSADMIN=admin
      - CUPSPASSWORD=REDACTED
      - LANG=ro_RO.UTF-8
      - LC_ALL=ro_RO.UTF-8
      - LC_PAPER=ro_RO.UTF-8
    dns:
      - 8.8.8.8
      - 1.1.1.1   
 #   deploy:
  #    resources:
   #     limits:
    #      cpus: '1.0'
     #     memory: 1G
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "1000:1000"
    restart: always
    ports:
      - "8090:80"
    volumes:
      - /home/cristi/server:/srv
      - /home/cristi/server/filebrowser.db:/database.db
    # Am pus căile absolute în comenzi ca să nu existe dubii
    command: ["--address", "0.0.0.0", "--port", "80", "--database", "/database.db", "--root", "/srv", "--noauth"]     

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      - ~/server/books:/books
      - ~/server/abs/config:/config
      - ~/server/abs/metadata:/metadata
    environment:
      - TZ=Europe/Bucharest
      - PUID=1000
      - PGID=1000
    restart: always

  changedetection:
    image: dgtlmoon/changedetection.io
    container_name: changedetection
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./changedetection_data:/datastore

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./radarr/config:/config
      - ./movies:/movies
      - ./downloads:/downloads
    ports:
      - 7878:7878
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./sonarr/config:/config
      - ./series:/series
      - ./downloads:/downloads
    ports:
      - 8989:8989
    restart: always
  
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./bazarr/config:/config
      - ./series:/series
      - ./movies:/movies
    ports:
      - 6767:6767
    restart: always

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: always
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:2375:2375

  # ── MQTT Broker ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - 1883:1883
    volumes:
      - /home/cristi/server/mosquitto/config:/mosquitto/config:ro
      - /home/cristi/server/mosquitto/data:/mosquitto/data
      - /home/cristi/server/mosquitto/log:/mosquitto/log
  # ── Home Assistant Core ──────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: always
    privileged: true
    network_mode: host          # necesar pentru mDNS discovery și acces MQTT local
    environment:
      - TZ=Europe/Bucharest
    volumes:
      - /home/cristi/server/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto
  # ── Deye Mock Logger ─────────────────────────────────────
  # Simulează logger-ul WiFi SolarmanV5 al invertorului Deye 12kW.
  # Publică date realiste pe MQTT la fiecare 5 secunde.
  # Când vine logger-ul fizic → comentezi/ștergi acest bloc
  # și adaugi integrarea pysolarmanv5 din HACS în Home Assistant.
  deye-mock:
    build:
      context: /home/cristi/server/deye-mock
      dockerfile: Dockerfile
    container_name: deye-mock
    restart: always
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INTERVAL=5               # secunde între publish-uri
      - TOPIC_PREFIX=deye/sensor
    depends_on:
      - mosquitto
