services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    init: true
    ports:
      - "3000:3000"
    volumes:
      - /home/cristi/server/homepage/config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.stoica-homepc.duckdns.org,*.stoica-homepc.duckdns.org,homepc.local:3000,homepc.local:3000,192.168.68.200:3000,homepc:3000,homepc.tail1b235c.ts.net:3000,100.113.68.25:3000,localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always 

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host
    volumes:
      - ./jellyfin:/config
      - ./movies:/media/movies
      - ./series:/media/series
    restart: always

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - ./qb-config:/config
      - ./downloads:/downloads
      - ./movies:/movies
    ports:
      - 51413:51413/tcp
      - 51413:51413/udp
      - 8080:8080
    restart: always
    dns: 
      - 8.8.8.8
      - 1.1.1.1
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    privileged: true  # Doar dacă tot mai dă erori de permisiuni
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CHOWN
    ports:
      - "192.168.68.200:53:53/tcp"
      - "100.113.68.25:53:53/tcp"
      - "192.168.68.200:53:53/udp"
      - "100.113.68.25:53:53/udp"
      - "8082:80"
    environment:
      - TZ=Europe/Bucharest
      - FTLCONF_webserver_api_password=REDACTED
    volumes:
      - /home/cristi/server/pihole/etc-pihole:/etc/pihole
      - /home/cristi/server/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: always

  cups-airprint:
    image: jdrtronix/cups-hplip:latest
    container_name: cups-airprint
    restart: always
    network_mode: host
    privileged: true
    devices:
      - "/dev/bus/usb/002/004:/dev/bus/usb/002/004" # Mapare directă bazată pe lsusb
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ./cups-config/etc-cups:/etc/cups
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
    environment:
      - CUPSADMIN=admin
      - CUPSPASSWORD=REDACTED
      - LANG=ro_RO.UTF-8
      - LC_ALL=ro_RO.UTF-8
      - LC_PAPER=ro_RO.UTF-8
    dns:
      - 8.8.8.8
      - 1.1.1.1   
 #   deploy:
  #    resources:
   #     limits:
    #      cpus: '1.0'
     #     memory: 1G
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "1000:1000"
    restart: always
    ports:
      - "8091:80"
    volumes:
      - /home/cristi/server:/srv
      - /home/cristi/server/filebrowser.db:/database.db
    # Am pus căile absolute în comenzi ca să nu existe dubii
    command: ["--address", "0.0.0.0", "--port", "80", "--database", "/database.db", "--root", "/srv", "--noauth"]     

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      - ~/server/books:/books
      - ~/server/abs/config:/config
      - ~/server/abs/metadata:/metadata
    environment:
      - TZ=Europe/Bucharest
      - PUID=1000
      - PGID=1000
    restart: always

  changedetection:
    image: dgtlmoon/changedetection.io
    container_name: changedetection
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./changedetection_data:/datastore

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./prowlarr/config:/config
    ports:
      - 9696:9696
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./radarr/config:/config
      - ./movies:/movies
      - ./downloads:/downloads
    ports:
      - 7878:7878
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./sonarr/config:/config
      - ./series:/series
      - ./downloads:/downloads
    ports:
      - 8989:8989
    restart: always
  
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    volumes:
      - ./bazarr/config:/config
      - ./series:/series
      - ./movies:/movies
    ports:
      - 6767:6767
    restart: always

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: always
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 127.0.0.1:2375:2375

  # ── MQTT Broker ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - 1883:1883
    volumes:
      - /home/cristi/server/mosquitto/config:/mosquitto/config:ro
      - /home/cristi/server/mosquitto/data:/mosquitto/data
      - /home/cristi/server/mosquitto/log:/mosquitto/log
  # ── Home Assistant Core ──────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: always
    privileged: true
    network_mode: host          # necesar pentru mDNS discovery și acces MQTT local
    environment:
      - TZ=Europe/Bucharest
    volumes:
      - /home/cristi/server/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mosquitto


  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: always
    volumes:
      - /home/cristi/server/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_3cde9ae64ca3ef11968046bd61ce3355-if00-port0:/dev/ttyUSB0
    ports:
      - "8099:8080"
    environment:
      - TZ=Europe/Bucharest
    depends_on:
      - mosquitto

  # ── Portainer (Docker management UI) ─────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/cristi/server/portainer/data:/data
    environment:
      - TZ=Europe/Bucharest

  # ── ClamAV (antivirus resident, scan via clamd socket) ───
  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: always
    volumes:
      - /home/cristi/server/clamav/db:/var/lib/clamav
      - /home/cristi/server/downloads:/scan:ro
    environment:
      - TZ=Europe/Bucharest
      - CLAMAV_NO_MILTERD=true
      - CLAMAV_NO_FRESHCLAMD=false
      - FRESHCLAM_CHECKS=2
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      retries: 3
      start_period: 5m

  # ── Jellyseerr (request UI pentru Sonarr + Radarr) ───────
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: always
    ports:
      - "5055:5055"
    environment:
      - TZ=Europe/Bucharest
      - LOG_LEVEL=info
    volumes:
      - /home/cristi/server/jellyseerr/config:/app/config

  # ── Caddy reverse proxy + SSL automat (Let's Encrypt via DuckDNS) ──
  caddy:
    build:
      context: ./caddy/build
      dockerfile: Dockerfile
    image: caddy-duckdns:custom
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /home/cristi/server/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/cristi/server/caddy/data:/data
      - /home/cristi/server/caddy/config:/config
    env_file:
      - /home/cristi/server/.env
    environment:
      - TZ=Europe/Bucharest

  # ── PostgreSQL pentru Authentik ─────────────────
  postgresql-authentik:
    image: docker.io/library/postgres:16-alpine
    container_name: postgresql-authentik
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /home/cristi/server/authentik/database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  # ── Redis pentru Authentik ──────────────────────
  redis-authentik:
    image: docker.io/library/redis:alpine
    container_name: redis-authentik
    command: --save 60 1 --loglevel warning
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - /home/cristi/server/authentik/redis:/data

  # ── Authentik server (UI + API) ─────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    restart: always
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - /home/cristi/server/authentik/media:/media
      - /home/cristi/server/authentik/custom-templates:/templates
    ports:
      - "9443:9000"
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy

  # ── Authentik worker (background jobs) ──────────
  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: always
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/cristi/server/authentik/media:/media
      - /home/cristi/server/authentik/certs:/certs
      - /home/cristi/server/authentik/custom-templates:/templates
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
